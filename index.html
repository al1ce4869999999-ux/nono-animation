
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>のののアニメ工房</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #faf5f0;
  color: #51443d;
  font-family: -apple-system, sans-serif;
}
main {
  max-width: 600px;
  margin: auto;
  padding: 24px 14px;
  text-align: center;
}
h1 { font-size: 24px; }
p { color: #8b7970; }
canvas {
  display: block;
  width: 100%;
  background: white;
  border-radius: 18px;
  touch-action: none;
  margin: 20px 0;
}
button, label {
  display: inline-block;
  margin: 5px;
  padding: 12px 18px;
  background: #b78f80;
  color: white;
  border: 0;
  border-radius: 24px;
  font-size: 15px;
}
input { display: none; }
</style>
</head>
<body>
<main>
  <h1>🐾 のののアニメ工房</h1>
  <p id="message">画像を選んでね</p>

  <canvas id="canvas" width="500" height="500"></canvas>

  <label>
    📷 画像を選ぶ
    <input type="file" id="file" accept="image/*">
  </label>
  <button id="select">しっぽを囲む</button>
  <button id="play">▶ ふりふり</button>
  <button id="stop">■ 停止</button>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const image = new Image();

let loaded = false;
let selecting = false;
let drawing = false;
let points = [];
let tail = null;
let playing = false;
let startTime = 0;

document.getElementById("file").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  image.onload = () => {
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    loaded = true;
    tail = null;
    playing = false;
    selecting = false;
    draw();
    message.textContent = "「しっぽを囲む」を押してね";
    URL.revokeObjectURL(url);
  };
  image.src = url;
};

function position(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * canvas.width / rect.width,
    y: (e.clientY - rect.top) * canvas.height / rect.height
  };
}

document.getElementById("select").onclick = () => {
  if (!loaded) return;
  playing = false;
  selecting = true;
  points = [];
  message.textContent = "しっぽの輪郭を指でなぞってね";
};

canvas.onpointerdown = e => {
  if (!selecting) return;
  drawing = true;
  points = [position(e)];
  canvas.setPointerCapture(e.pointerId);
};

canvas.onpointermove = e => {
  if (!drawing) return;
  points.push(position(e));
  draw();
};

canvas.onpointerup = () => {
  if (!drawing) return;
  drawing = false;
  selecting = false;

  if (points.length < 3) return;

  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);
  const x = Math.max(0, Math.floor(Math.min(...xs)));
  const y = Math.max(0, Math.floor(Math.min(...ys)));
  const right = Math.min(canvas.width, Math.ceil(Math.max(...xs)));
  const bottom = Math.min(canvas.height, Math.ceil(Math.max(...ys)));
  const w = right - x;
  const h = bottom - y;
  if (w < 2 || h < 2) return;

  const layer = document.createElement("canvas");
  layer.width = w;
  layer.height = h;
  const lc = layer.getContext("2d");

  lc.beginPath();
  points.forEach((p, i) => {
    if (i === 0) lc.moveTo(p.x - x, p.y - y);
    else lc.lineTo(p.x - x, p.y - y);
  });
  lc.closePath();
  lc.clip();
  lc.drawImage(image, -x, -y);

  tail = {layer, x, y, w, h};
  points = [];
  message.textContent = "「ふりふり」を押してね！";
  draw();
};

function draw(time = 0) {
  if (!loaded) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0);

  if (tail) {
    const angle = playing
      ? Math.sin((time - startTime) / 240) * 0.25
      : 0;

    // しっぽの下端中央を回転の支点にする
    const pivotX = tail.x + tail.w / 2;
    const pivotY = tail.y + tail.h;

    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(angle);
    ctx.drawImage(
      tail.layer,
      tail.x - pivotX,
      tail.y - pivotY
    );
    ctx.restore();
  }

  if (drawing && points.length) {
    ctx.strokeStyle = "#ff7890";
    ctx.lineWidth = Math.max(3, canvas.width / 200);
    ctx.beginPath();
    points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
}

function animate(time) {
  if (!playing) return;
  draw(time);
  requestAnimationFrame(animate);
}

document.getElementById("play").onclick = () => {
  if (!tail || playing) return;
  playing = true;
  startTime = performance.now();
  requestAnimationFrame(animate);
};

document.getElementById("stop").onclick = () => {
  playing = false;
  draw();
};
</script>
</body>
</html>
