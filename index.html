
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>のののアニメ工房</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #faf5f0;
  color: #51443d;
  font-family: -apple-system, sans-serif;
}
main {
  max-width: 560px;
  margin: auto;
  padding: 28px 18px;
  text-align: center;
}
h1 { font-size: 25px; }
p { color: #8b7970; }
.stage {
  background: white;
  border: 2px dashed #ddc7b9;
  border-radius: 22px;
  min-height: 300px;
  display: grid;
  place-items: center;
  overflow: hidden;
  margin: 24px 0;
}
.stage img {
  display: none;
  max-width: 100%;
  max-height: 450px;
  object-fit: contain;
}
button, .upload {
  display: inline-block;
  border: 0;
  border-radius: 30px;
  background: #b78f80;
  color: white;
  padding: 15px 24px;
  font-size: 16px;
  cursor: pointer;
}
input { display: none; }
</style>
</head>
<body>
<main>
  <h1>🐾 のののアニメ工房</h1>
  <p>お気に入りの子に、ちいさな動きを。</p>

  <div class="stage">
    <p id="hint">ここにイラストが表示されるよ</p>
    <img id="character" alt="キャラクター">
  </div>

  <label class="upload">
    📷 イラストを選ぶ
    <input type="file" id="file" accept="image/*">
  </label>
</main>

<script>
const file = document.getElementById("file");
const image = document.getElementById("character");
const hint = document.getElementById("hint");

file.addEventListener("change", () => {
  const selected = file.files[0];
  if (!selected) return;

  const reader = new FileReader();
  reader.onload = () => {
    image.src = reader.result;
    image.style.display = "block";
    hint.style.display = "none";
  };
  reader.readAsDataURL(selected);
});
</script>
</body>
</html>
