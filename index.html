
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f2ea">
<title>のののアニメ工房</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fffaf6,#f1e5dd);color:#51443d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}
main{max-width:680px;margin:auto;padding:26px 16px 48px}header{text-align:center;padding:8px 0 12px}h1{font-size:clamp(24px,6vw,34px);letter-spacing:.02em;margin:4px 0}p{color:#8b7970}header p{margin:8px 0 0;font-size:14px}
.card{background:#fff;border:1px solid #eadbd2;border-radius:24px;padding:17px;box-shadow:0 10px 30px #70513d12;margin:16px 0}
.sectiontitle{font-size:15px;font-weight:750;margin:0 0 12px;display:flex;gap:7px;align-items:center}
canvas{display:block;width:100%;height:auto;background:linear-gradient(45deg,#faf5f1 25%,#fff 25%,#fff 75%,#faf5f1 75%);background-size:24px 24px;border-radius:17px;touch-action:none;max-height:55vh;object-fit:contain}
#message{min-height:40px;background:#faf0ea;border-radius:12px;padding:11px 13px;font-size:13px;margin:12px 0;color:#71594d}
.row{display:flex;flex-wrap:wrap;gap:8px}.row>*{flex:1}
button,.upload{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:11px 14px;background:#ad7b69;color:white;border:0;border-radius:14px;font-size:14px;font-weight:650;text-align:center;cursor:pointer;margin:0}
button.secondary{background:#f4e8e0;color:#705549}button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none}input[type=range]{width:100%;accent-color:#ad7b69}
select{font:inherit;width:100%;padding:12px;border:1px solid #dfc9bd;background:#fffaf7;color:#5a463e;border-radius:12px}
.setting{padding:9px 0}.setting label{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-bottom:5px}.setting output{color:#9a6a56;font-variant-numeric:tabular-nums}
small,.hint{color:#998278;font-size:12px;line-height:1.6}.hint{margin:10px 0 0}.step{display:inline-flex;background:#f6e8df;color:#a47866;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:750;margin-bottom:9px}
footer{text-align:center;padding:5px 0;font-size:12px;color:#9f897d}
</style>
</head>
<body>
<main>
<header><div class="step">Nono Motion Studio · β</div><h1>🐾 のののアニメ工房</h1><p>一枚のイラストに、ちいさな動きを。</p></header>
<section class="card">
<div class="sectiontitle">① イラストを読み込む</div>
<canvas id="canvas" width="500" height="500" aria-label="アニメーション編集キャンバス"></canvas>
<p id="message" role="status" aria-live="polite">画像を選んでね</p>
<div class="row"><label class="upload">📷 画像を選ぶ<input type="file" id="file" accept="image/*"></label><button class="secondary" id="select">✏️ しっぽを囲む</button></div>
<p class="hint">しっぽの輪郭を指でなぞって、付け根をタップ。画像内のパーツが動きます。</p>
</section>
<section class="card">
<div class="sectiontitle">② 動きを決める</div>
<div class="setting"><label for="preset">動きの種類</label><select id="preset"><option value="wag">しっぽをふりふり</option><option value="happy">うれしい！ぱたぱた</option><option value="slow">ゆったり、ふわふわ</option><option value="nervous">おずおず、ちょこちょこ</option></select></div>
<div class="setting"><label for="speed">速さ <output id="speedValue">1.0倍</output></label><input id="speed" type="range" min="0.3" max="3" step="0.1" value="1"></div>
<div class="setting"><label for="amplitude">揺れ幅 <output id="amplitudeValue">15°</output></label><input id="amplitude" type="range" min="2" max="45" step="1" value="15"></div>
<div class="row"><button id="play">▶ 再生する</button><button class="secondary" id="stop">■ 停止</button></div>
</section>
<section class="card">
<div class="sectiontitle">③ 保存する</div>
<div class="setting"><label for="duration">動画の長さ <output id="durationValue">3秒</output></label><input id="duration" type="range" min="1" max="10" step="1" value="3"></div>
<div class="row"><button class="secondary" id="saveImage">🖼️ 画像を保存</button><button id="saveVideo">🎬 動画を書き出す</button></div>
<p class="hint">画像はPNG。動画はブラウザが録画に対応する場合に保存できます。iPhone Safariでは機種・OSによって動画書き出しが使えない場合があります。</p>
</section><footer>のののアニメ工房 · 画像は端末内で処理されます</footer>
</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const image = new Image();

let loaded = false;
let selecting = false;
let drawing = false;
let choosingPivot = false;
let points = [];
let tail = null;
let pivot = null;
let playing = false;
let startTime = null;
let frameId = null;
let activePointer = null;
const $ = id => document.getElementById(id);
let recording = false;
const motion = {speed:1, amplitude:15, preset:"wag"};
const presets = {wag:[1,15],happy:[2,25],slow:[0.6,9],nervous:[2.7,6]};
function updateMotionUI(){motion.speed=Number($("speed").value);motion.amplitude=Number($("amplitude").value);motion.preset=$("preset").value;$("speedValue").textContent=motion.speed.toFixed(1)+"倍";$("amplitudeValue").textContent=motion.amplitude+"°";}
$("preset").addEventListener("change",()=>{const [speed,angle]=presets[$("preset").value];$("speed").value=speed;$("amplitude").value=angle;updateMotionUI();});
["speed","amplitude"].forEach(id=>$(id).addEventListener("input",updateMotionUI));
$("duration").addEventListener("input",()=>{$("durationValue").textContent=$("duration").value+"秒";});

function report(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#b42318" : "";
}

function stopAnimation() {
  playing = false;
  if (frameId !== null) cancelAnimationFrame(frameId);
  frameId = null;
  startTime = null;
}

function resetSelection() {
  selecting = false;
  drawing = false;
  choosingPivot = false;
  activePointer = null;
  points = [];
  tail = null;
  pivot = null;
}

document.getElementById("file").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  stopAnimation();
  resetSelection();
  loaded = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  report("画像を読み込んでいます…");
  const url = URL.createObjectURL(file);
  image.onload = () => {
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    loaded = true;
    draw();
    report("「しっぽを囲む」を押してね");
    URL.revokeObjectURL(url);
  };
  image.onerror = () => {
    URL.revokeObjectURL(url);
    report("画像を読み込めませんでした。PNG または JPEG の画像を選び直してください。", true);
  };
  image.src = url;
};

function position(e) {
  // TouchEvent itself has no clientX/clientY; use its active/finished touch.
  const contact = e.touches?.[0] || e.changedTouches?.[0] || e;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height ||
      !Number.isFinite(contact.clientX) || !Number.isFinite(contact.clientY)) {
    throw new Error("タッチ位置を取得できませんでした。もう一度しっぽを囲んでください。");
  }
  return {
    x: Math.max(0, Math.min(canvas.width, (contact.clientX - rect.left) * canvas.width / rect.width)),
    y: Math.max(0, Math.min(canvas.height, (contact.clientY - rect.top) * canvas.height / rect.height))
  };
}

document.getElementById("select").onclick = () => {
  if (!loaded) return report("先に画像を読み込んでください。", true);
  stopAnimation();
  resetSelection();
  selecting = true;
  draw();
  report("しっぽの輪郭を指でなぞり、指を離してね");
};

function inputError(error) {
  drawing = false;
  activePointer = null;
  points = [];
  draw();
  report(error.message, true);
}

function begin(e) {
  if ((!selecting && !choosingPivot) || activePointer !== null) return;
  if (e.isPrimary === false || (e.button !== undefined && e.button !== 0)) return;
  if (e.cancelable) e.preventDefault();
  try {
    const point = position(e);
    if (choosingPivot) {
      pivot = point;
      choosingPivot = false;
      draw();
      report("付け根を指定しました。「▶ ふりふり」を押してね！");
      return;
    }
    activePointer = e.pointerId ?? e.touches?.[0]?.identifier ?? "mouse";
    drawing = true;
    points = [point];
    // Capture is optional; window listeners also receive release outside canvas.
    if (e.pointerId !== undefined && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* window fallback */ }
    }
    draw();
  } catch (error) { inputError(error); }
}

function matchesInput(e) {
  if (e.pointerId !== undefined) return e.pointerId === activePointer;
  if (e.changedTouches) return Array.from(e.changedTouches).some(t => t.identifier === activePointer);
  return activePointer === "mouse";
}

function move(e) {
  if (!drawing || !matchesInput(e)) return;
  if (e.cancelable) e.preventDefault();
  try {
    points.push(position(e));
    draw();
  } catch (error) { inputError(error); }
}

function finish(e) {
  if (!drawing || !matchesInput(e)) return;
  if (e.cancelable) e.preventDefault();
  try {
    points.push(position(e));
    drawing = false;
    activePointer = null;
    if (points.length < 3) throw new Error("範囲が選択されていません。指を動かしてしっぽの輪郭を囲んでください。");
    const xs = points.map(p => p.x);
    const ys = points.map(p => p.y);
    const x = Math.floor(Math.min(...xs));
    const y = Math.floor(Math.min(...ys));
    const w = Math.ceil(Math.max(...xs)) - x;
    const h = Math.ceil(Math.max(...ys)) - y;
    const area = Math.abs(points.reduce((sum, p, i) => {
      const next = points[(i + 1) % points.length];
      return sum + p.x * next.y - next.x * p.y;
    }, 0)) / 2;
    if (w < 2 || h < 2 || area < 2) throw new Error("選択範囲が小さすぎるか、線になっています。しっぽを面で囲み直してください。");
    const layer = document.createElement("canvas");
    layer.width = w;
    layer.height = h;
    const lc = layer.getContext("2d");
    if (!lc) throw new Error("しっぽの画像を作成できませんでした。画像を小さくして再試行してください。");
    lc.beginPath();
    points.forEach((p, i) => {
      if (i === 0) lc.moveTo(p.x - x, p.y - y);
      else lc.lineTo(p.x - x, p.y - y);
    });
    lc.closePath();
    lc.clip();
    lc.drawImage(image, -x, -y);
    const pixels = lc.getImageData(0, 0, w, h).data;
    if (!pixels.some((v, i) => i % 4 === 3 && v > 0)) {
      throw new Error("選択範囲に画像がありません。しっぽを囲み直してください。");
    }
    tail = {layer, x, y, w, h};
    points = [];
    selecting = false;
    choosingPivot = true;
    draw();
    report("しっぽを選択しました。回転させる付け根をタップしてね");
  } catch (error) { inputError(error); }
}

function cancelInput(e) {
  if (!drawing || !matchesInput(e)) return;
  inputError(new Error("タッチ操作が中断されました。もう一度しっぽを囲んでください。"));
}

if (window.PointerEvent) {
  canvas.addEventListener("pointerdown", begin);
  window.addEventListener("pointermove", move, {passive: false});
  window.addEventListener("pointerup", finish, {passive: false});
  window.addEventListener("pointercancel", cancelInput);
  canvas.addEventListener("lostpointercapture", cancelInput);
} else {
  canvas.addEventListener("touchstart", begin, {passive: false});
  window.addEventListener("touchmove", move, {passive: false});
  window.addEventListener("touchend", finish, {passive: false});
  window.addEventListener("touchcancel", cancelInput);
  canvas.addEventListener("mousedown", begin);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", finish);
}

function draw(time = 0) {
  if (!loaded) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0);
  if (tail && pivot) {
    const angle = playing && startTime !== null
      ? Math.sin((time - startTime) * motion.speed / 240) * (motion.amplitude * Math.PI / 180) : 0;
    ctx.save();
    ctx.translate(pivot.x, pivot.y);
    ctx.rotate(angle);
    ctx.drawImage(tail.layer, tail.x - pivot.x, tail.y - pivot.y);
    ctx.restore();
  }
  if (drawing && points.length) {
    ctx.strokeStyle = "#ff7890";
    ctx.lineWidth = Math.max(3, canvas.width / 200);
    ctx.beginPath();
    points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
  if (pivot && !playing && !recording) {
    ctx.fillStyle = "#ff7890";
    ctx.beginPath();
    ctx.arc(pivot.x, pivot.y, Math.max(3, canvas.width / 100), 0, Math.PI * 2);
    ctx.fill();
  }
}

function animationError(error) {
  stopAnimation();
  report("アニメーションを開始・継続できませんでした：" + error.message, true);
}

function animate(time) {
  frameId = null;
  if (!playing) return;
  try {
    // Use the first RAF timestamp so start and frames share the same clock.
    if (startTime === null) startTime = time;
    draw(time);
    frameId = requestAnimationFrame(animate);
  } catch (error) { animationError(error); }
}

document.getElementById("play").onclick = () => {
  if (!loaded) return report("先に画像を読み込んでください。", true);
  if (drawing || selecting || !tail) return report("しっぽの選択が完了していません。輪郭を囲んで指を離してください。", true);
  if (!pivot) return report("付け根が未指定です。画像のしっぽの付け根をタップしてください。", true);
  if (playing) return report("アニメーションは再生中です。");
  if (typeof requestAnimationFrame !== "function") return report("このブラウザーはアニメーションに対応していません。Safari を更新してください。", true);
  stopAnimation();
  playing = true;
  try {
    frameId = requestAnimationFrame(animate);
    report("しっぽをふりふりしています");
  } catch (error) { animationError(error); }
};

document.getElementById("stop").onclick = () => {
  stopAnimation();
  draw();
  report("停止しました。再生するには「▶ ふりふり」を押してください。");
};

$("saveImage").addEventListener("click",()=>{
  if(!loaded)return report("先に画像を読み込んでください。",true);
  const wasPlaying=playing;stopAnimation();draw();
  const link=document.createElement("a");link.href=canvas.toDataURL("image/png");link.download="nono-frame.png";link.click();
  if(wasPlaying)$("play").click();else report("画像を書き出しました");
});
$("saveVideo").addEventListener("click",async()=>{
  if(recording)return;
  if(!loaded||!tail||!pivot)return report("先に画像としっぽ、付け根を指定してください。",true);
  if(typeof canvas.captureStream!=="function"||typeof MediaRecorder==="undefined")return report("このSafariでは動画録画に対応していません。画像保存をご利用ください。",true);
  const types=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm"];
  const type=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!type)return report("対応する動画形式が見つかりません。Safariのバージョンを確認してください。",true);
  let stream;
  try{
    stopAnimation();recording=true;$("saveVideo").disabled=true;
    stream=canvas.captureStream(30);
    const chunks=[];
    const recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:2500000});
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    recorder.onerror=()=>report("動画の録画に失敗しました。",true);
    const result=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=reject;});
    recorder.start();playing=true;startTime=null;frameId=requestAnimationFrame(animate);
    report("動画を書き出しています…");
    await new Promise(resolve=>setTimeout(resolve,Number($("duration").value)*1000));
    recorder.stop();await result;
    const blob=new Blob(chunks,{type});
    if(!blob.size)throw new Error("動画データが空です");
    const url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download="nono-animation."+(type.includes("mp4")?"mp4":"webm");link.click();
    setTimeout(()=>URL.revokeObjectURL(url),60000);report("動画を保存しました。");
  }catch(error){report("動画の書き出しに失敗しました："+error.message,true);}
  finally{recording=false;$("saveVideo").disabled=false;stopAnimation();draw();if(stream)stream.getTracks().forEach(t=>t.stop());}
});
</script>
</body>
</html>
